{% extends "base.html" %}

{% block title %}Edit Purchase{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Edit Purchase</h1>

        <p class="page-description">
            Correct the quantity or purchase price for this purchase.
        </p>


        <form
            action="{{ url_for('edit_purchase', purchase_id=purchase['id']) }}"
            method="POST"
            class="purchase-form"
        >

            <!-- Product -->

            <div class="form-group">

                <label>Product</label>

                <input
                    type="text"
                    value="{{ purchase['product_name'] }}"
                    readonly
                >

            </div>


            <!-- Supplier -->

            <div class="form-group">

                <label>Supplier</label>

                <input
                    type="text"
                    value="{{ purchase['supplier_name'] }}"
                    readonly
                >

            </div>


            <!-- Quantity -->

            <div class="form-group">

                <label for="quantity">
                    Quantity
                    <span>{{ purchase['unit'] }}</span>
                </label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    value="{{ purchase['quantity'] }}"
                    required
                >

            </div>


            <!-- Purchase Price -->

            <div class="form-group">

                <label for="purchase_price">
                    Purchase Price
                </label>

                <input
                    type="number"
                    id="purchase_price"
                    name="purchase_price"
                    min="0"
                    step="0.01"
                    value="{{ purchase['purchase_price'] }}"
                    required
                >

            </div>


            <div class="action-buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="fa-solid fa-save"></i>
                    Save Changes
                </button>

                <a
                    href="{{ url_for('purchase_history') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
